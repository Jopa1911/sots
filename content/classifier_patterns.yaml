# Rule-based classifier of the teacher's sentences (offline, no model needed).
# Text is lower-cased and apostrophes are removed before matching ("it's" -> "its", "don't" -> "dont").
# Each pattern is [regex, weight]. Escalating behaviours (A1-A3) win whenever their score reaches `anti_threshold`.
# A trained ESConv classifier (data/train_strategy_classifier.py) can replace the S1-S8 part.

anti_threshold: 2.5
priority: [S6, S3, S2, S5, S1, S7, S4, S8]   # tie-breaking order

patterns:
  A1:  # appeal to rules / rights
    - ['\brules are rules\b', 3]
    - ['\b(those|these|that) (are|is) the rules\b', 3]
    - ['\b(its|it is|that is|thats) (the |our |school )?(policy|rule|regulation)s?\b', 3]
    - ['\baccording to the (rules|regulations|policy|rulebook)\b', 3]
    - ['\bi (just |only )?follow(ed)? the (rules|policy|regulations|rubric)\b', 3]
    - ['\b(there is|theres) nothing (i|we) can do\b', 3]
    - ['\bnothing i can do\b', 3]
    - ['\b(the|this|his|her) (grade|decision) (stands|is final|is fair|is correct|wont change|will not change|cannot be changed|cant be changed)\b', 3]
    - ['\bi graded (it |the test |everything )?(correctly|fairly|by the book|properly)\b', 3]
    - ['\bby the book\b', 2.5]
    - ['\b(its|it is|thats|that is) not my (fault|problem|responsibility|job)\b', 3]
    - ['\b(i cannot|i cant|im not allowed to|i am not allowed to) change\b', 3]
  A2:  # minimising, interrupting, sarcasm
    - ['\bcalm down\b', 3]
    - ['\b(relax|chill out|chill)\b', 3]
    - ['\b(its|it is) (just|only) (a|one) (grade|test|mark|trip|note)\b', 3]
    - ['\b(no|not a|not such a) big deal\b', 3]
    - ['\b(youre|you are) overreacting\b', 3]
    - ['\boverreact', 2.5]
    - ['\bdont be (so )?(dramatic|emotional|ridiculous|silly)\b', 3]
    - ['\bnothing to (worry|be upset|get upset|be angry) about\b', 3]
    - ['\bover nothing\b', 3]
    - ['\bwhatever\b', 2.5]
    - ['\blet me finish\b', 2.5]
    - ['\bstop (shouting|yelling|interrupting|screaming)\b', 3]
    - ['\bget over it\b', 3]
    - ['\b(seriously|really)\?', 2.5]
  A3:  # threats, authority, blaming
    - ['\b(go ahead and|feel free to|then) (complain|go|talk) to the (principal|director|headmaster)\b', 3]
    - ['\bif you (dont|do not) like it\b', 3]
    - ['\b(i will|ill) (report|call security|hang up)\b', 3]
    - ['\b(he|she|luka|mila|your (son|daughter|child|kid)) (is|was) (just |simply |really |very )?(lazy|the problem|not trying|careless)\b', 3]
    - ['\blazy\b', 2.5]
    - ['\b(he|she|luka|mila) (just |simply )?(doesnt|does not|didnt|did not) (try|study|care|listen|work)\b', 3]
    - ['\bwhy (didnt|did not|doesnt|does not|dont|do not) (he|she|luka|mila|you)\b', 2.5]
    - ['\b(its|it is|thats) (his|her|your|lukas|milas) (fault|problem)\b', 3]
    - ['\b(he|she|luka|mila) (should|needs to|has to) (study|work|try) (more|harder)\b', 3]
    - ['\bmaybe if you (helped|checked|paid|cared|raised)\b', 3]
    - ['\byou should (have )?(raise|raised|check|checked|help|helped) (him|her|your)\b', 3]
    - ['\b(i am|im) the teacher\b', 3]
    - ['\bi know (better|what im doing|what i am doing)\b', 3]
    - ['\bdont tell me how to\b', 3]
  S1:  # question
    - ['\?\s*$', 1.0]
    - ['\b(what|how|which|when|where)\b[^.!]*\?', 1.5]
    - ['\b(can|could|would) you (tell|explain|describe|share) (me )?(more|what|how|about)\b', 2]
    - ['\btell me (more|about|what)\b', 2]
    - ['\bhelp me understand\b', 2]
    - ['\bwhat (happened|worries|bothers|upset|upsets|concerns)\b', 2]
  S2:  # restatement or paraphrasing
    - ['\bif i (understand|understood|get|got) (you |this |that |it )?(correctly|right)\b', 2.5]
    - ['\bso (what )?(youre|you are) saying\b', 2.5]
    - ['\b(youre|you are) saying that\b', 2.5]
    - ['\blet me (make sure|check) (that )?i understand\b', 2.5]
    - ['\bin other words\b', 2.5]
    - ['\bwhat (i am|im) hearing is\b', 2.5]
    - ['\b(it sounds like|sounds like) you (are saying|mean|think)\b', 2.5]
    - ['\bso,? (you|your) (feel|think|believe|mean)\b', 2]
    - ['\byou mean\b', 1.5]
  S3:  # reflection of feelings
    - ['\bi (can )?(hear|see|sense|understand|imagine) (that |how |why )?(you are|youre|you feel|youre feeling|you must|this is|that is|it is)\b', 2.5]
    - ['\byou (must|might) (be|feel)\b', 2.5]
    - ['\b(that|this|it) (must|might) (be|feel|have been)\b', 2]
    - ['\b(youre|you are) (clearly |understandably |really |very |so )?(upset|angry|frustrated|disappointed|worried|concerned|annoyed|scared|afraid|hurt)\b', 2.5]
    - ['\b(your) (frustration|anger|worry|concern|disappointment|fear)\b', 1.5]
    - ['\b(sounds|it sounds) (really |very |so )?(frustrating|upsetting|stressful|difficult|hard|worrying|scary)\b', 2.5]
    - ['\bhow (upset|frustrated|worried|angry|disappointed|hard) (you|this|that)\b', 2.5]
    - ['\bi (understand|see) (how|why) (you feel|this|that)\b', 2]
    - ['\b(feels?|seems?|felt|must feel) (so |really |very |a bit )?(unfair|frustrating|upsetting|wrong|hard|difficult|disappointing|stressful|worrying)\b', 2.5]
  S4:  # self-disclosure
    - ['\bas a (parent|mother|father|mom|dad)( myself)?\b', 2.5]
    - ['\b(i am|im) a (parent|mother|father|mom|dad)( too| myself)?\b', 2.5]
    - ['\bi (have|had|ve) (been|gone) through (something similar|a similar|the same)\b', 2.5]
    - ['\bi have been in a similar\b', 2.5]
    - ['\bwhen i was (a student|at school|young|a kid|in school)\b', 2.5]
    - ['\bmy (own )?(son|daughter|child|kid|children)\b', 2.5]
    - ['\bi remember (when|how|feeling)\b', 2.5]
    - ['\bi (felt|feel) the same\b', 2.5]
  S5:  # affirmation and reassurance
    - ['\b(youre|you are) right to\b', 2]
    - ['\b(its|it is|thats|that is) (completely |totally |perfectly )?(understandable|natural|normal|reasonable|valid)\b', 2]
    - ['\bthank you for (calling|reaching out|telling|bringing|letting|sharing|your call)\b', 2]
    - ['\b(i am|im) glad you (called|reached out|told|came)\b', 2]
    - ['\bgood (that|thing) you (called|reached out|told)\b', 2]
    - ['\b(it is|its) good that you\b', 2]
    - ['\byou (clearly |really |obviously )?care (a lot |deeply )?about\b', 2]
    - ['\byour (concern|worry|question) is (valid|justified|fair|important|understandable)\b', 2]
    - ['\b(that is|thats|this is) a (fair|valid|good|important) (point|question|concern)\b', 2]
    - ['\bwe (both )?want (whats|what is) best for\b', 2]
    - ['\byou did the right thing\b', 2]
    - ['\b(youre|you are) (absolutely |completely |totally )?right\b', 2]
    - ['\b(i am|im) (so |really |very )?sorry\b', 2]
    - ['\bi apologi[sz]e\b', 2]
    - ['\bdont worry\b', 1.5]
    - ['\b(it|everything) (will|ll) be (ok|okay|fine|alright|all right)\b', 1.5]
  S6:  # providing suggestions
    - ['\bi (suggest|propose|recommend)\b', 2]
    - ['\bhow about\b', 2]
    - ['\bwhat if we\b', 2]
    - ['\b(we|you) could\b', 1.5]
    - ['\bcould we\b', 1.5]
    - ['\bshall we\b', 1.5]
    - ['\blets\b', 1.5]
    - ['\bwould you like to (meet|come|go through|look|talk|schedule)\b', 2]
    - ['\bwhy dont we\b', 2]
    - ['\bwe can (meet|go through|look|review|schedule|arrange|set up|talk|sit down)\b', 2]
    - ['\b(i can|i could|i will|ill) (offer|arrange|set up|schedule|send|show|give|prepare|organize|organise|call|update|keep|let|message|email|text|inform|contact|write to|check in)\b', 2]
    - ['\b(retake|re-take|takes? (the|this|that) test again|second chance|extra (help|lesson|class|support)|tutoring|practice session)\b', 1.5]
    - ['\bgo through the (test|exam|tasks)\b', 1.5]
    - ['\b(meet|meeting|appointment) (tomorrow|on monday|on tuesday|on wednesday|on thursday|on friday|next week|this week|after school)\b', 1.5]
    - ['\b(keep you (informed|updated)|weekly (update|report|message|email)|every week)\b', 1.5]
  S7:  # information
    - ['\b(the|this|that) (test|exam) (was|were|had|has|covered|included|contained)\b', 2]
    - ['\b(the|this|that|his|her) (grade|score|result|results|criteria|rubric|average) (was|is) (based|calculated|a|an|the)\b', 2]
    - ['\b(the|this|that) (grade|score|result|average) reflects\b', 2]
    - ['\b(he|she|luka|mila) (got|scored|had|missed|answered|solved|made|received)\b', 1.5]
    - ['\b\d+ (points|out of|tasks|questions|percent)\b', 1.5]
    - ['\baccording to (the )?(test|results|records|rubric|criteria)\b', 1.5]
    - ['\bclass average\b', 2]
    - ['\bwe (covered|practised|practiced|did|worked on) (this|that|fractions|it)\b', 2]
    - ['\bon (monday|tuesday|wednesday|thursday|friday)\b', 1.0]
    - ['\bthe (notes?|trip|decision) (was|were|is|are)\b', 1.5]
    - ['\bthe reason (is|was)\b', 1.5]
  S8:  # others
    - ['^(hi|hello|hey|good (morning|afternoon|evening))\b', 1.5]
    - ['\b(thank you|thanks)\b', 0.8]
    - ['\b(bye|goodbye|have a (nice|good) day|see you)\b', 1.5]
    - ['^(ok|okay|yes|no|sure|right|i see|mhm)[.!]?$', 1.0]
